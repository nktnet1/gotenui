name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and lint
        run: pnpm check
      - name: Build with native Vite config without known warnings
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
          if grep -E '\[MODULE_LEVEL_DIRECTIVE\]|output\.codeSplitting\.groups\[[0-9]+\]\.name.*function|unsupported by.*configLoader' build.log; then
            echo '::error::Vite/Nitro build warnings have regressed.'
            exit 1
          fi
      # Building generates the TanStack file-route types used by tsc and Vitest.
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Smoke-test built Nitro deployment without Docker
        run: pnpm test:smoke
      - name: Exercise desktop and mobile UI in headless Chrome
        run: pnpm test:browser

  integration:
    name: Integration tests (Gotenberg ${{ matrix.gotenberg-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gotenberg-version: ["8.40.0", "9.1.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Docker
        run: docker info
      - name: Integration tests against Gotenberg ${{ matrix.gotenberg-version }}
        env:
          GOTENBERG_TEST_VERSION: ${{ matrix.gotenberg-version }}
        run: pnpm test:integration
