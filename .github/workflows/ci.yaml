name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and lint
        run: pnpm check
      - name: Build with native Vite config without known warnings
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
          if grep -E '\[MODULE_LEVEL_DIRECTIVE\]|output\.codeSplitting\.groups\[[0-9]+\]\.name.*function|unsupported by.*configLoader' build.log; then
            echo '::error::Vite/Nitro build warnings have regressed.'
            exit 1
          fi
      # Building generates the TanStack file-route types used by tsc and Vitest.
      - name: Typecheck
        run: pnpm typecheck
      - name: Resolve pinned backend source
        id: contract
        run: echo "ref=v$(node --input-type=module -e 'import { GOTENBERG_TEST_VERSIONS } from "./scripts/gotenberg-test-versions.ts"; console.log(GOTENBERG_TEST_VERSIONS.v9)')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: gotenberg/gotenberg
          ref: ${{ steps.contract.outputs.ref }}
          path: .upstream/gotenberg
          persist-credentials: false
      - name: Unit tests and upstream contract checks
        env:
          GOTENBERG_SOURCE_DIR: .upstream/gotenberg
        run: pnpm test:unit
      - name: Smoke-test built Nitro deployment without Docker
        run: pnpm test:smoke
      - name: Exercise desktop and mobile UI in headless Chrome
        run: pnpm test:browser

  integration:
    name: Integration tests (Gotenberg ${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [v8, v9]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Docker
        run: docker info
      - name: Integration tests against Gotenberg ${{ matrix.suite }}
        run: pnpm test:integration:${{ matrix.suite }}

  compatibility-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
      - id: versions
        run: echo "versions=$(node scripts/gotenberg-test-versions.ts)" >> "$GITHUB_OUTPUT"

  compatibility:
    name: Compatibility (Gotenberg ${{ matrix.version }})
    needs: compatibility-versions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.compatibility-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compatibility tests
        run: pnpm test:integration ${{ matrix.version }}
