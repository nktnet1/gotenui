name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Re-runs of the same tag cannot publish concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Match tag against package version
        id: tag
        run: node scripts/validate-release-tag.ts
      - name: Require the tagged commit to be on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo '::error::Release tags must point to a commit on the default branch.'
            exit 1
          fi

  ci:
    name: Run full CI
    needs: verify
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  build:
    name: Build container (${{ matrix.platform }})
    needs: [verify, ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Normalise container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set OCI labels and annotations
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - name: Build and push native image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - name: Export image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Build did not return a valid sha256 image digest.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Share image digest with publish job
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image to GHCR
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Normalise container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set OCI labels and semver tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - name: Download native image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Create and verify multi-platform manifest
        id: manifest
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digest_files=("$RUNNER_TEMP/digests/"*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "::error::Expected two native image digests, found ${#digest_files[@]}."
            exit 1
          fi
          sources=()
          for file in "${digest_files[@]}"; do
            digest="${file##*/}"
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo '::error::Invalid native image digest artifact.'
              exit 1
            fi
            sources+=("${IMAGE}@sha256:${digest}")
          done
          tags=()
          first_tag=''
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            tags+=(--tag "$tag")
            if [[ -z "$first_tag" ]]; then
              first_tag="$tag"
            fi
          done <<< "$TAGS"
          if [[ -z "$first_tag" ]]; then
            echo '::error::No version tags were generated for the release.'
            exit 1
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          manifest="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}')"
          if ! jq -e '([.manifests[] | select(.platform.os == "linux" and (.platform.architecture == "amd64" or .platform.architecture == "arm64")) | .platform.architecture] | unique) == ["amd64", "arm64"]' <<< "$manifest" >/dev/null; then
            echo '::error::Published manifest is missing amd64 or arm64.'
            exit 1
          fi
          digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published \`${IMAGE}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create draft GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Prepare draft release from changelog after image upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; preserving its existing state and notes."
            exit 0
          fi
          node scripts/prepare-release-notes.ts
          options=(
            --repo "$GITHUB_REPOSITORY"
            --verify-tag
            --draft
            --notes-file "$RUNNER_TEMP/gotenui-release-notes.md"
            --title "$TAG"
          )
          if [[ "$PRERELEASE" == 'true' ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${options[@]}"
