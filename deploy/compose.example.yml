# Local test deployment; the server-side proxy reaches Gotenberg on the Docker network.
# Bind to localhost only unless you add authentication, HTTPS and rate limiting.
services:
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    expose:
      - "3000"
  gotenui:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      GOTENBERG_ALLOWED_URLS: https://demo.gotenberg.dev,http://gotenberg:3000
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      - gotenberg
