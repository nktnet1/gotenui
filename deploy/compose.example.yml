# Local deployment. Gotenui reaches Gotenberg on the Docker network.
# The UI binds to localhost. Optional Basic Auth is configured below.
services:
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    expose:
      - "3000"
  gotenui:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PUBLIC_GOTENBERG_DEFAULT_URL: ${PUBLIC_GOTENBERG_DEFAULT_URL:-https://demo.gotenberg.dev}
        PUBLIC_GOTENUI_MAX_UPLOAD_BYTES: ${PUBLIC_GOTENUI_MAX_UPLOAD_BYTES:-4000000}
    environment:
      GOTENBERG_ALLOWED_URLS: ${GOTENBERG_ALLOWED_URLS:-https://demo.gotenberg.dev,http://gotenberg:3000}
      # Empty values leave app-level Basic Auth disabled.
      GOTENUI_BASIC_AUTH_USERNAME: ${GOTENUI_BASIC_AUTH_USERNAME:-}
      GOTENUI_BASIC_AUTH_PASSWORD: ${GOTENUI_BASIC_AUTH_PASSWORD:-}
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      - gotenberg
