server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    # Optional same-origin proxy: use /gotenberg in Gotenui's connection settings.
    # This is intentionally an example for private, authenticated networks only.
    location /gotenberg/ {
        proxy_pass http://gotenberg:3000/;
        proxy_read_timeout 180s;
        proxy_request_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
